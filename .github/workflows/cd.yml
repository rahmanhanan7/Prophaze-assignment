name: "CI/CD — Flask K8s API"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:  # <-- Added this required top-level key
  deploy:
    name: Deploy to K8s
    runs-on: self-hosted           # your local machine runner
    # needs: build                 # <-- NOTE: Commented this out because "build" job isn't defined in this file. 
    if: github.ref == 'refs/heads/main'   # only on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in deployment
        run: |
          sed -i "s|hananpp/prophase:.*|hananpp/prophase:${{ github.sha }}|g" Kubernetes/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f Kubernetes/deployment.yaml
          # kubectl apply -f Kubernetes/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/flask-api --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -l app=flask-api
          kubectl get svc
